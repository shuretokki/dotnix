[env]
NIX_CONFIG = "experimental-features = nix-command flakes"

[tasks.build]
description = "Build a system without activating it"
usage = 'arg "[host]" help="Host name" default="desktop"'
run = 'nix build ".#nixosConfigurations.${usage_host?}.config.system.build.toplevel" --no-link'

[tasks.check]
description = "Run all flake checks"
run = "nix flake check"

[tasks.fmt]
description = "Format all Nix files"
run = "nix fmt"

[tasks.update]
description = "Update flake inputs"
run = "nix flake update"

[tasks.test]
description = "Activate a system until the next reboot"
usage = 'arg "[host]" help="Host name" default="desktop"'
run = 'sudo nixos-rebuild test --flake ".#${usage_host?}"'

[tasks.switch]
description = "Activate a system and make it the boot default"
usage = 'arg "[host]" help="Host name" default="desktop"'
run = 'sudo nixos-rebuild switch --flake ".#${usage_host?}"'
