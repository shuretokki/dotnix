[env]
NIX_CONFIG = "experimental-features = nix-command flakes"

[tasks.build]
description = "Build a system without activating it"
usage = 'arg "[host]" help="Host name" default="desktop"'
run = 'nix build ".#nixosConfigurations.${usage_host?}.config.system.build.toplevel" --no-link'

[tasks.check]
description = "Run all flake checks"
run = "nix flake check"

[tasks.fmt]
description = "Format all Nix files"
run = "nix fmt"

[tasks.update]
description = "Update everything, or one custom package or flake input"
usage = 'arg "[name]" help="Package in pkgs/ or flake input, for example mist"'
run = '''
sys=$(nix eval --raw --impure --expr builtins.currentSystem)
pkgs=$(nix eval --raw ".#packages.$sys" --apply 'p: builtins.concatStringsSep " " (builtins.attrNames p)')
bump() { nix run nixpkgs#nix-update -- --flake "$1" --version=stable --build; }
if [ -z "${usage_name:-}" ]; then
  nix flake update
  for p in $pkgs; do bump "$p"; done
elif [[ " $pkgs " == *" $usage_name "* ]]; then
  bump "$usage_name"
else
  nix flake update "$usage_name"
fi
'''

[tasks.test]
description = "Activate a system until the next reboot, with a change diff"
usage = 'arg "[host]" help="Host name" default="desktop"'
run = 'nh os test . --hostname "${usage_host?}"'

[tasks.boot]
description = "Make a system the boot default without activating it, with a change diff"
usage = 'arg "[host]" help="Host name" default="desktop"'
run = 'nh os boot . --hostname "${usage_host?}"'

[tasks.option]
description = "Show the upstream description and source file of a NixOS option"
usage = '''
arg "<option>" help="Option path, for example boot.loader.limine.maxGenerations"
arg "[host]" help="Host name" default="desktop"
'''
run = '''
nix eval --raw ".#nixosConfigurations.${usage_host?}.options.${usage_option?}.description" --apply 'd: if builtins.isAttrs d then d.text else d'
echo
nix eval --raw ".#nixosConfigurations.${usage_host?}.options.${usage_option?}.declarations" --apply 'd: builtins.concatStringsSep "\n" (map toString d)'
'''

[tasks.upstream]
description = "Find a line in the nixpkgs installer templates and show the comment above it"
usage = '''
arg "<text>" help="Text to search for, for example allowUnfree"
arg "[host]" help="Host name" default="desktop"
'''
run = '''
src=$(nix eval --raw ".#nixosConfigurations.${usage_host?}.config.nixpkgs.flake.source")
grep -rnF -B2 -- "${usage_text?}" "$src/nixos/modules/installer" "$src/pkgs/by-name/ca/calamares-nixos-extensions"
'''

[tasks.home-option]
description = "Show the upstream description and source file of a Home Manager option"
usage = '''
arg "<option>" help="Option path, for example programs.git.enable"
arg "[host]" help="Host name" default="desktop"
'''
run = '''
nix eval --raw ".#nixosConfigurations.${usage_host?}.options.home-manager.users.type.getSubOptions" --apply "f: let d = (f [ \"user\" ]).${usage_option?}.description; in if builtins.isAttrs d then d.text else d"
echo
nix eval --raw ".#nixosConfigurations.${usage_host?}.options.home-manager.users.type.getSubOptions" --apply "f: builtins.concatStringsSep \"\\n\" (map toString (f [ \"user\" ]).${usage_option?}.declarations)"
'''
